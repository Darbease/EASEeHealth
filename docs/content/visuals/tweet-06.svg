<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0B1120"/><rect width="1600" height="6" fill="#2DD4BF" opacity="0.9"/><polygon points="74,48 96.5166604983954,61 96.51666049839541,87 74,100 51.483339501604604,87.00000000000001 51.48333950160459,61.000000000000014" fill="none" stroke="#375BD2" stroke-width="4.5"/><polygon points="74,62 84.39230484541326,68 84.39230484541326,80 74,86 63.607695154586736,80 63.607695154586736,68" fill="none" stroke="#5C7CE8" stroke-width="3"/><text x="116" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#F1F5F9" font-weight="700" text-anchor="start">EASE eHealth</text><text x="116" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#8FA3C4" font-weight="400" text-anchor="start">on Chainlink CRE</text><text x="1540" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5B6C8C" font-weight="700" text-anchor="end">6 / 15</text><rect x="60" y="132" width="204" height="44" rx="22" fill="none" stroke="#2DD4BF" stroke-width="2.5"/><text x="84" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#2DD4BF" font-weight="700" text-anchor="start" letter-spacing="2">THE THESIS</text><line x1="60" y1="836" x2="1540" y2="836" stroke="#1E2A44" stroke-width="2"/><text x="60" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" fill="#F1F5F9" font-weight="700" text-anchor="start">Healthcare payments should be two questions:</text><rect x="60" y="330" width="1480" height="130" rx="22" fill="#111A2E" stroke="#1E2A44" stroke-width="2"/><text x="100" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="64" fill="#2DD4BF" font-weight="800" text-anchor="start">1</text><text x="170" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" fill="#F1F5F9" font-weight="600" text-anchor="start">Does the patient medically require this care?</text><rect x="60" y="490" width="1480" height="130" rx="22" fill="#111A2E" stroke="#1E2A44" stroke-width="2"/><text x="100" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="64" fill="#2DD4BF" font-weight="800" text-anchor="start">2</text><text x="170" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" fill="#F1F5F9" font-weight="600" text-anchor="start">Is the patient in the network, on the plan?</text><line x1="800" y1="650" x2="800" y2="700" stroke="#34D399" stroke-width="5"/><polygon points="800,700 786,693 786,707" fill="#34D399" transform="rotate(90,800,700)"/><text x="800" y="760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" fill="#34D399" font-weight="800" text-anchor="middle">If both are true, funds release to cover the care.</text><text x="800" y="810" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#8FA3C4" font-weight="400" text-anchor="middle">Everything else is overhead.</text><text x="60" y="874" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#5B6C8C" font-weight="400" text-anchor="start">The whole transaction</text><text x="1540" y="874" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#5B6C8C" font-weight="400" text-anchor="end">github.com/Darbease/EASEeHealth</text></svg>