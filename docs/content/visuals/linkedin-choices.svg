<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0B1120"/><rect width="1600" height="6" fill="#5C7CE8"/><polygon points="74,48 96.5166604983954,61 96.51666049839541,87 74,100 51.483339501604604,87.00000000000001 51.48333950160459,61.000000000000014" fill="none" stroke="#375BD2" stroke-width="4.5"/><polygon points="74,62 84.39230484541326,68 84.39230484541326,80 74,86 63.607695154586736,80 63.607695154586736,68" fill="none" stroke="#5C7CE8" stroke-width="3"/><text x="116" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#F1F5F9" font-weight="700" text-anchor="start">EASE eHealth</text><text x="116" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#8FA3C4" font-weight="400" text-anchor="start">on Chainlink CRE</text><text x="1540" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#5B6C8C" font-weight="700" text-anchor="end" letter-spacing="3">DESIGN CHOICES</text><rect x="60" y="160" width="1480" height="128" rx="22" fill="#111A2E" stroke="#1E2A44" stroke-width="2"/><rect x="60" y="160" width="14" height="128" rx="7" fill="#5C7CE8"/><text x="110" y="215" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#5C7CE8" font-weight="800" text-anchor="start">Shared registries, no owner</text><text x="110" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#8FA3C4" font-weight="400" text-anchor="start">A fix written once propagates to every payer — no chokepoint to freeze</text><rect x="60" y="304" width="1480" height="128" rx="22" fill="#111A2E" stroke="#1E2A44" stroke-width="2"/><rect x="60" y="304" width="14" height="128" rx="7" fill="#2DD4BF"/><text x="110" y="359" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#2DD4BF" font-weight="800" text-anchor="start">FHIR / Da Vinci shapes, not custom JSON</text><text x="110" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#8FA3C4" font-weight="400" text-anchor="start">Conform to the 2027 mandate — payers recognize every model</text><rect x="60" y="448" width="1480" height="128" rx="22" fill="#111A2E" stroke="#1E2A44" stroke-width="2"/><rect x="60" y="448" width="14" height="128" rx="7" fill="#FBBF24"/><text x="110" y="503" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#FBBF24" font-weight="800" text-anchor="start">Hybrid plan: gates on-chain, design by hash</text><text x="110" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#8FA3C4" font-weight="400" text-anchor="start">Payer-signed (EIP-712), verifiable by anyone, gas stays sane</text><rect x="60" y="592" width="1480" height="128" rx="22" fill="#111A2E" stroke="#1E2A44" stroke-width="2"/><rect x="60" y="592" width="14" height="128" rx="7" fill="#34D399"/><text x="110" y="647" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#34D399" font-weight="800" text-anchor="start">Necessity judged from the EHR record</text><text x="110" y="692" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#8FA3C4" font-weight="400" text-anchor="start">Diagnosis + treatment history vs. plan criteria — how payers actually adjudicate</text><rect x="60" y="736" width="1480" height="128" rx="22" fill="#111A2E" stroke="#1E2A44" stroke-width="2"/><rect x="60" y="736" width="14" height="128" rx="7" fill="#F87171"/><text x="110" y="791" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#F87171" font-weight="800" text-anchor="start">Enforcement in the contract, not the workflow</text><text x="110" y="836" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#8FA3C4" font-weight="400" text-anchor="start">Escrow reverts on DENIED — even a buggy orchestrator can't move funds</text></svg>