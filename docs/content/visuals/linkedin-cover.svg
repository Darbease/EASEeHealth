<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#0B1120"/><rect width="1920" height="8" fill="#375BD2"/><polygon points="74,48 96.5166604983954,61 96.51666049839541,87 74,100 51.483339501604604,87.00000000000001 51.48333950160459,61.000000000000014" fill="none" stroke="#375BD2" stroke-width="4.5"/><polygon points="74,62 84.39230484541326,68 84.39230484541326,80 74,86 63.607695154586736,80 63.607695154586736,68" fill="none" stroke="#5C7CE8" stroke-width="3"/><text x="116" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#F1F5F9" font-weight="700" text-anchor="start">EASE eHealth</text><text x="116" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#8FA3C4" font-weight="400" text-anchor="start">on Chainlink CRE</text><text x="96" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="110" fill="#F1F5F9" font-weight="800" text-anchor="start">Two questions</text><text x="96" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="110" fill="#F1F5F9" font-weight="800" text-anchor="start">and a payment.</text><text x="96" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" fill="#8FA3C4" font-weight="400" text-anchor="start">Rebuilding US prior authorization on rails no one owns —</text><text x="96" y="696" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" fill="#8FA3C4" font-weight="400" text-anchor="start">FHIR APIs in, smart-contract verification, instant settlement out.</text><text x="96" y="830" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" fill="#2DD4BF" font-weight="700" text-anchor="start">Decisions measured in milliseconds.</text><text x="96" y="882" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" fill="#FBBF24" font-weight="700" text-anchor="start">The regulatory ceiling is 72 hours.</text><g transform="rotate(-8,1455,545)"><rect x="1380" y="380" width="150" height="330" rx="14" fill="#111A2E" stroke="#2DD4BF" stroke-width="3.5"/><line x1="1390" y1="545" x2="1520" y2="545" stroke="#2DD4BF" stroke-width="2.5"/><circle cx="1425" cy="452.6" r="7" fill="#2DD4BF"/><circle cx="1485" cy="479" r="7" fill="#2DD4BF"/><circle cx="1432.5" cy="617.6" r="7" fill="#2DD4BF"/><circle cx="1477.5" cy="644" r="7" fill="#2DD4BF"/></g><g transform="rotate(16,1635,585)"><rect x="1560" y="420" width="150" height="330" rx="14" fill="#111A2E" stroke="#FBBF24" stroke-width="3.5"/><line x1="1570" y1="585" x2="1700" y2="585" stroke="#FBBF24" stroke-width="2.5"/><circle cx="1605" cy="492.6" r="7" fill="#FBBF24"/><circle cx="1665" cy="519" r="7" fill="#FBBF24"/><circle cx="1612.5" cy="657.6" r="7" fill="#FBBF24"/><circle cx="1657.5" cy="684" r="7" fill="#FBBF24"/></g><g transform="rotate(44,1775,685)"><rect x="1700" y="520" width="150" height="330" rx="14" fill="#111A2E" stroke="#F87171" stroke-width="3.5"/><line x1="1710" y1="685" x2="1840" y2="685" stroke="#F87171" stroke-width="2.5"/><circle cx="1745" cy="592.6" r="7" fill="#F87171"/><circle cx="1805" cy="619" r="7" fill="#F87171"/><circle cx="1752.5" cy="757.6" r="7" fill="#F87171"/><circle cx="1797.5" cy="784" r="7" fill="#F87171"/></g><line x1="96" y1="990" x2="1824" y2="990" stroke="#1E2A44" stroke-width="2"/><text x="96" y="1040" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5B6C8C" font-weight="400" text-anchor="start">github.com/Darbease/EASEeHealth</text></svg>