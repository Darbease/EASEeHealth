" fill="#F1F5F9" font-weight="700" text-anchor="start">Rules answer question 2 deterministically. The TEE answers question 1.</text><text x="60" y="874" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#5B6C8C" font-weight="400" text-anchor="start">Deterministic fallback when the TEE is offline — stamped verdict_source: fallback</text><text x="1540" y="874" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#5B6C8C" font-weight="400" text-anchor="end">github.com/Darbease/EASEeHealth</text></svg>