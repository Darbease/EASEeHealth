8FA3C4" font-weight="400" text-anchor="start">Signed by the payer — EIP-712</text><text x="100" y="482" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="29" fill="#8FA3C4" font-weight="400" text-anchor="start">Full benefit design pinned by hash</text><text x="100" y="538" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="29" fill="#8FA3C4" font-weight="400" text-anchor="start">Verified before trusting a byte</text><text x="100" y="618" font-family="Menlo, monospace" font-size="26" fill="#34D399" font-weight="700" text-anchor="start">PlanCommitment ✓ signature verified</text><rect x="820" y="240" width="720" height="420" rx="22" fill="#111A2E" stroke="#1E2A44" stroke-width="2"/><text x="860" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#2DD4BF" font-weight="800" text-anchor="start">Medical necessity — from the EHR</text><text x="860" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="29" fill="#8FA3C4" font-weight="400" text-anchor="start">Diagnosis + reason codes</text><text x="860" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="29" fill="#8FA3C4" font-weight="400" text-anchor="start">Documented treatment history</text><text x="860" y="482" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="29" fill="#8FA3C4" font-weight="400" text-anchor="start">Physician's letter on file</text><text x="860" y="538" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="29" fill="#8FA3C4" font-weight="400" text-anchor="start">Checked against the plan's criteria</text><rect x="1460" y="312.68" width="54" height="31.319999999999997" rx="6.4799999999999995" fill="#2DD4BF"/><path d="M 1471.88 314.3 v -9.719999999999999 a 15.120000000000001 15.120000000000001 0 0 1 30.240000000000002 0 v 9.719999999999999" fill="none" stroke="#2DD4BF" stroke-width="5.94"/><circle cx="1487" cy="326.72" r="4.32" fill="#0B1120"/><tex