 Helvetica, Arial, sans-serif" font-size="22" fill="#8FA3C4" font-weight="400" text-anchor="middle">Blocking health data</text><text x="300" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8FA3C4" font-weight="400" text-anchor="middle">becomes illegal</text><circle cx="660" cy="520" r="16" fill="#0B1120" stroke="#F87171" stroke-width="5"/><line x1="660" y1="540" x2="660" y2="570" stroke="#F87171" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="490" y="580" width="340" height="180" rx="22" fill="#111A2E" stroke="#F87171" stroke-width="2.5"/><text x="660" y="626" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#F87171" font-weight="800" text-anchor="middle">Feb 2024</text><text x="660" y="672" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#F1F5F9" font-weight="700" text-anchor="middle">Change Healthcare falls</text><text x="660" y="706" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8FA3C4" font-weight="400" text-anchor="middle">1 missing MFA control →</text><text x="660" y="736" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8FA3C4" font-weight="400" text-anchor="middle">~50% of claims frozen</text><circle cx="1020" cy="520" r="16" fill="#0B1120" stroke="#FBBF24" stroke-width="5"/><line x1="1020" y1="500" x2="1020" y2="460" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="850" y="270" width="340" height="180" rx="22" fill="#111A2E" stroke="#FBBF24" stroke-width="2.5"/><text x="1020" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#FBBF24" font-weight="800" text-anchor="middle">Jul 2025</text><text x="1020" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#F1F5F9" font-weight="700" text-anchor="middle">GENIUS Act</text><text x="1020" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8FA3C4" font-weight="400" text-anchor="middle">Federal framework</text><text x="1020" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8FA3C4" font-weight="400" text-anchor="middle">for stablecoins</text><circle cx="1380" cy="520" r="16" fill="#0B1120" stroke="#5C7CE8" stroke-width="5"/><line x1="1380" y1="540" x2="1380" y2="570" stroke="#5C7CE8" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="1210" y="580" width="340" height="180" rx="22" fill="#111A2E" stroke="#5C7CE8" stroke-width="2.5"/><text x="1380" y="626" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#5C7CE8" font-weight="800" text-anchor="middle">Jan 2027</text><text x="1380" y="672" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#F1F5F9" font-weight="700" text-anchor="middle">CMS-0057-F deadline</text><text x="1380" y="706" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8FA3C4" font-weight="400" text-anchor="middle">FHIR prior-auth APIs</text><text x="1380" y="736" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8FA3C4" font-weight="400" text-anchor="middle">mandatory for payers</text><text x="60" y="860" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#8FA3C4" font-weight="400" text-anchor="start">Data must move over APIs. Money is moving on-chain. The middleman already failed.</text></svg>