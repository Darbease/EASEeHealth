<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0B1120"/><rect width="1600" height="6" fill="#34D399" opacity="0.9"/><polygon points="74,48 96.5166604983954,61 96.51666049839541,87 74,100 51.483339501604604,87.00000000000001 51.48333950160459,61.000000000000014" fill="none" stroke="#375BD2" stroke-width="4.5"/><polygon points="74,62 84.39230484541326,68 84.39230484541326,80 74,86 63.607695154586736,80 63.607695154586736,68" fill="none" stroke="#5C7CE8" stroke-width="3"/><text x="116" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#F1F5F9" font-weight="700" text-anchor="start">EASE eHealth</text><text x="116" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#8FA3C4" font-weight="400" text-anchor="start">on Chainlink CRE</text><text x="1540" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5B6C8C" font-weight="700" text-anchor="end">13 / 15</text><rect x="60" y="132" width="438" height="44" rx="22" fill="none" stroke="#34D399" stroke-width="2.5"/><text x="84" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#34D399" font-weight="700" text-anchor="start" letter-spacing="2">THE MONEY CAN'T MISBEHAVE</text><line x1="60" y1="836" x2="1540" y2="836" stroke="#1E2A44" stroke-width="2"/><text x="60" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#F1F5F9" font-weight="700" text-anchor="start">Decision written on-chain via DON-signed reports.</text><text x="60" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#F1F5F9" font-weight="700" text-anchor="start">If APPROVED — stablecoin funds release from escrow in the same flow.</text><rect x="60" y="380" width="1480" height="260" rx="22" fill="#0A0F1C" stroke="#1E2A44" stroke-width="2"/><text x="100" y="460" font-family="Menlo, Consolas, monospace" font-size="32" fill="#8FA3C4" font-weight="400" text-anchor="start">function releasePayout(bytes32 claimId) {</text><text x="140" y="515" font-family="Menlo, Consolas, monospace" font-size="32" fill="#F1F5F9" font-weight="400" text-anchor="start">require(decisions.isApproved(claimId),</text><text x="140" y="570" font-family="Menlo, Consolas, monospace" font-size="32" fill="#F87171" font-weight="400" text-anchor="start">"ClaimEscrow: claim not approved");  // REVERTS</text><text x="100" y="620" font-family="Menlo, Consolas, monospace" font-size="32" fill="#8FA3C4" font-weight="400" text-anchor="start">}</text><text x="60" y="740" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="48" fill="#34D399" font-weight="800" text-anchor="start">A denied claim cannot be paid.</text><text x="60" y="790" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#8FA3C4" font-weight="400" text-anchor="start">Enforced by the contract itself — not by the workflow.</text><text x="60" y="874" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#5B6C8C" font-weight="400" text-anchor="start">Even a buggy or malicious orchestrator can't move funds for a denied claim</text><text x="1540" y="874" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#5B6C8C" font-weight="400" text-anchor="end">github.com/Darbease/EASEeHealth</text></svg>