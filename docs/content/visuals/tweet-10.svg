<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0B1120"/><rect width="1600" height="6" fill="#2DD4BF" opacity="0.9"/><polygon points="74,48 96.5166604983954,61 96.51666049839541,87 74,100 51.483339501604604,87.00000000000001 51.48333950160459,61.000000000000014" fill="none" stroke="#375BD2" stroke-width="4.5"/><polygon points="74,62 84.39230484541326,68 84.39230484541326,80 74,86 63.607695154586736,80 63.607695154586736,68" fill="none" stroke="#5C7CE8" stroke-width="3"/><text x="116" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#F1F5F9" font-weight="700" text-anchor="start">EASE eHealth</text><text x="116" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#8FA3C4" font-weight="400" text-anchor="start">on Chainlink CRE</text><text x="1540" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5B6C8C" font-weight="700" text-anchor="end">10 / 15</text><rect x="60" y="132" width="484.8" height="44" rx="22" fill="none" stroke="#2DD4BF" stroke-width="2.5"/><text x="84" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#2DD4BF" font-weight="700" text-anchor="start" letter-spacing="2">CONFIDENTIAL BY CONSTRUCTION</text><line x1="60" y1="836" x2="1540" y2="836" stroke="#1E2A44" stroke-width="2"/><rect x="60" y="300" width="400" height="170" rx="22" fill="#111A2E" stroke="#1E2A44" stroke-width="2"/><text x="260" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#F1F5F9" font-weight="700" text-anchor="middle">Clinical record</text><text x="260" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#8FA3C4" font-weight="400" text-anchor="middle">(FHIR source)</text><rect x="470" y="355" width="620" height="60" rx="30" fill="none" stroke="#2DD4BF" stroke-width="3.5" stroke-dasharra