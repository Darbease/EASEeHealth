<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0B1120"/><rect width="1600" height="6" fill="#5C7CE8" opacity="0.9"/><polygon points="74,48 96.5166604983954,61 96.51666049839541,87 74,100 51.483339501604604,87.00000000000001 51.48333950160459,61.000000000000014" fill="none" stroke="#375BD2" stroke-width="4.5"/><polygon points="74,62 84.39230484541326,68 84.39230484541326,80 74,86 63.607695154586736,80 63.607695154586736,68" fill="none" stroke="#5C7CE8" stroke-width="3"/><text x="116" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#F1F5F9" font-weight="700" text-anchor="start">EASE eHealth</text><text x="116" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#8FA3C4" font-weight="400" text-anchor="start">on Chainlink CRE</text><text x="1540" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5B6C8C" font-weight="700" text-anchor="end">5 / 15</text><rect x="60" y="132" width="188.4" height="44" rx="22" fill="none" stroke="#5C7CE8" stroke-width="2.5"/><text x="84" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#5C7CE8" font-weight="700" text-anchor="start" letter-spacing="2">THE PIVOT</text><line x1="60" y1="836" x2="1540" y2="836" stroke="#1E2A44" stroke-width="2"/><text x="60" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#8FA3C4" font-weight="400" text-anchor="start">Health data legally must move over APIs.</text><text x="60" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#8FA3C4" font-weight="400" text-anchor="start">Money is moving to smart contracts.</text><text x="60" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#8FA3C4" font-weight="400" text-anchor="start">The centralized middleman is a proven single point of failure.</text><rect x="60" y="480" width="380" height="160" rx="22" fill="#111A2E" stroke="#1E2A44" stroke-width="2"/><text x="250" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" fill="#F1F5F9" font-weight="700" text-anchor="middle">FHIR APIs</text><text x="250" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#8FA3C4" font-weight="400" text-anchor="middle">health data in</text><line x1="450" y1="560" x2="560" y2="560" stroke="#5C7CE8" stroke-width="3.5"/><polygon points="560,560 546,553 546,567" fill="#5C7CE8" transform="rotate(0,560,560)"/><line x1="560" y1="588" x2="450" y2="588" stroke="#5C7CE8" stroke-width="3.5"/><polygon points="450,588 436,581 436,595" fill="#5C7CE8" transform="rotate(180,450,588)"/><g><polygon points="800,468 879.6743371481683,514 879.6743371481683,606 800,652 720.3256628518317,606 720.3256628518316,514" fill="none" stroke="#375BD2" stroke-width="6"/><polygon points="800,496 855.4256258422041,528 855.4256258422041,592 800,624 744.5743741577959,592 744.5743741577959,528" fill="none" stroke="#5C7CE8" stroke-width="3"/></g><text x="800" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" fill="#F1F5F9" font-weight="800" text-anchor="middle">CRE</text><text x="800" y="592" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#2DD4BF" font-weight="700" text-anchor="middle">no owner</text><line x1="1040" y1="560" x2="1150" y2="560" stroke="#5C7CE8" stroke-width="3.5"/><polygon points="1150,560 1136,553 1136,567" fill="#5C7CE8" transform="rotate(0,1150,560)"/><line x1="1150" y1="588" x2="1040" y2="588" stroke="#5C7CE8" stroke-width="3.5"/><polygon points="1040,588 1026,581 1026,595" fill="#5C7CE8" transform="rotate(180,1040,588)"/><rect x="1160" y="480" width="380" height="160" rx="22" fill="#111A2E" stroke="#1E2A44" stroke-width="2"/><text x="1350" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#F1F5F9" font-weight="700" text-anchor="middle">Smart contracts</text><text x="1350" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#8FA3C4" font-weight="400" text-anchor="middle">verification + settlement</text><text x="60" y="780" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" fill="#2DD4BF" font-weight="800" text-anchor="start">The use case: prior authorization.</text><text x="60" y="874" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#5B6C8C" font-weight="400" text-anchor="start">Sitting between APIs and smart contracts, with no owner in the middle, is exactly what CRE is</text><text x="1540" y="874" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#5B6C8C" font-weight="400" text-anchor="end">github.com/Darbease/EASEeHealth</text></svg>