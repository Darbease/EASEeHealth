<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0B1120"/><rect width="1600" height="6" fill="#5C7CE8" opacity="0.9"/><polygon points="74,48 96.5166604983954,61 96.51666049839541,87 74,100 51.483339501604604,87.00000000000001 51.48333950160459,61.000000000000014" fill="none" stroke="#375BD2" stroke-width="4.5"/><polygon points="74,62 84.39230484541326,68 84.39230484541326,80 74,86 63.607695154586736,80 63.607695154586736,68" fill="none" stroke="#5C7CE8" stroke-width="3"/><text x="116" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#F1F5F9" font-weight="700" text-anchor="start">EASE eHealth</text><text x="116" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#8FA3C4" font-weight="400" text-anchor="start">on Chainlink CRE</text><text x="1540" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5B6C8C" font-weight="700" text-anchor="end">11 / 15</text><rect x="60" y="132" width="594" height="44" rx="22" fill="none" stroke="#5C7CE8" stroke-width="2.5"/><text x="84" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#5C7CE8" font-weight="700" text-anchor="start" letter-spacing="2">THEN CRE CHECKS THE SMART CONTRACTS</text><line x1="60" y1="836" x2="1540" y2="836" stroke="#1E2A44" stroke-width="2"/><rect x="60" y="240" width="1480" height="150" rx="22" fill="#111A2E" stroke="#1E2A44" stroke-width="2"/><rect x="60" y="240" width="14" height="150" rx="7" fill="#5C7CE8"/><text x="110" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#5C7CE8" font-weight="800" text-anchor="start">OrganizationRegistry</text><text x="110" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#F1F5F9" font-weight="400" text-anchor="start">Is this provider in-network for the plan?</text><rect x="60" y="420" width="1480" height="150" rx="22" fill="#111A2E" stroke="#1E2A44" stroke-width="2"/><rect x="60" y="420" width="14" height="150" rx="7" fill="#2DD4BF"/><text x="110" y="482" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#2DD4BF" font-weight="800" text-anchor="start">CoverageRegistry</text><text x="110" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#F1F5F9" font-weight="400" text-anchor="start">Is this patient actually ON the plan, right now?</text><rect x="60" y="600" width="1480" height="150" rx="22" fill="#111A2E" stroke="#1E2A44" stroke-width="2"/><rect x="60" y="600" width="14" height="150" rx="7" fill="#FBBF24"/><text x="110" y="662" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#FBBF24" font-weight="800" text-anchor="start">PolicyRegistry</text><text x="110" y="712" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#F1F5F9" font-weight="400" text-anchor="start">Is the procedure covered — and under the cap?</text><text x="60" y="810" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#8FA3C4" font-weight="400" text-anchor="start">Three reads against shared registries — the same state every payer and provider sees.</text><text x="60" y="874" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#5B6C8C" font-weight="400" text-anchor="start">EVM reads with DON consensus</text><text x="1540" y="874" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#5B6C8C" font-weight="400" text-anchor="end">github.com/Darbease/EASEeHealth</text></svg>