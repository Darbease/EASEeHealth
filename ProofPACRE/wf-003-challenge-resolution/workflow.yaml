# ==========================================================================
# WF-003: Challenge Resolution (Log trigger)
# ==========================================================================
# Log-triggered automated compliance gate: fires when ProofEvaluated is
# emitted on-chain. Runs risk analysis on approved claims — challenges
# automatically if amount exceeds caps or consent was revoked post-approval.

# ==========================================================================
staging-settings:
  user-workflow:
    workflow-name: "EASEeHealth-WF003-ChallengeResolution-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "../secrets.yaml"

# ==========================================================================
production-settings:
  user-workflow:
    workflow-name: "EASEeHealth-WF003-ChallengeResolution-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "../secrets.yaml"
