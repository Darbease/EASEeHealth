# ==========================================================================
# WF-008: HTTP Prior Auth
# ==========================================================================
# HTTP-triggered workflow that fires immediately when a signed prior-auth
# request arrives at the CRE gateway. All claim data comes from the HTTP
# payload — no cron polling delay, no EHR fetch needed.

# ==========================================================================
staging-settings:
  user-workflow:
    workflow-name: "EASEeHealth-WF008-HttpPriorAuth-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "../secrets.yaml"

# ==========================================================================
production-settings:
  user-workflow:
    workflow-name: "EASEeHealth-WF008-HttpPriorAuth-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "../secrets.yaml"
