# ==========================================================================
# WF-007: Claim Transfer Settlement
# ==========================================================================
# Log-triggered workflow that reacts to ClaimSubmitted events on-chain.
# Settles high-value TRANSFERIN claims: consent check, policy check,
# proof evaluation, payout via ClaimEscrow. No submitClaim call —
# the claim is already SUBMITTED (that's what triggered us).

# ==========================================================================
staging-settings:
  user-workflow:
    workflow-name: "EASEeHealth-WF007-ClaimTransferSettlement-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "../secrets.yaml"

# ==========================================================================
production-settings:
  user-workflow:
    workflow-name: "EASEeHealth-WF007-ClaimTransferSettlement-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "../secrets.yaml"
