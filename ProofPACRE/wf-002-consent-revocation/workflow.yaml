# ==========================================================================
# WF-002: Consent Revocation (HTTP trigger)
# ==========================================================================
# HTTP-triggered consent cascade: patient portal sends a signed revocation
# request, workflow fires immediately to revoke consent on-chain and
# cascade across affected claims (challenge + cancel payout).

# ==========================================================================
staging-settings:
  user-workflow:
    workflow-name: "EASEeHealth-WF002-ConsentRevocation-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "../secrets.yaml"

# ==========================================================================
production-settings:
  user-workflow:
    workflow-name: "EASEeHealth-WF002-ConsentRevocation-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "../secrets.yaml"
